<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo_inicio.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <title>Componentes - P2Price</title>
    <style>
        /* Estilos específicos para la sección de componentes */
        .components-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .dropdown-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
        }

        .dropdown-trigger {
            width: 100%;
            background: none;
            border: none;
            color: white;
            padding: 22px 30px;
            text-align: left;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }

        .dropdown-trigger:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .dropdown-icon {
            font-size: 1rem;
            color: var(--text-dim);
            transition: transform 0.3s;
        }

        .dropdown-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0, 1, 0, 1);
            background: rgba(0, 0, 0, 0.15);
            padding: 0 30px;
        }

        /* Clase activa controlada por JS */
        .dropdown-card.active .dropdown-content {
            max-height: 4000px; /* Incrementado para la base masiva de datos */
            padding: 20px 30px 30px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            transition: max-height 0.4s cubic-bezier(1, 0, 1, 0);
        }

        .dropdown-card.active .dropdown-icon {
            transform: rotate(180deg);
            color: var(--accent-blue);
        }

        /* Buscador interno del Dropdown */
        .inner-search-container {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .inner-search-container input {
            background: none;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            font-size: 0.9rem;
        }

        /* Estilos internos de las sub-marcas */
        .hardware-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .brand-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
        }

        .brand-title {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-blue);
            margin-bottom: 15px;
            font-weight: 700;
            border-bottom: 1px solid rgba(0, 120, 242, 0.2);
            padding-bottom: 5px;
        }

        .component-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .component-item {
            font-size: 0.95rem;
            color: #d1d1d6;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            transition: 0.2s;
            cursor: pointer;
        }

        .component-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            transform: translateX(5px);
        }

        .no-results {
            color: var(--text-dim);
            font-size: 0.9rem;
            font-style: italic;
            padding: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <main class="main-content">

                <div class="dropdown-content">

            <div class="dropdown-card" id="card-gpu">

                    </div>

            </div>

            <div class="dropdown-card" id="card-igpu">
                <button class="dropdown-trigger" onclick="toggleDropdown(this)">
                    <span>Tarjetas Gráficas Integradas (iGPU)</span>
                    <span class="dropdown-icon">▼</span>
                </button>
                <div class="dropdown-content">
                    <div class="inner-search-container">
                        <span>🔍</span>
                        <input type="text" placeholder="Buscar integrada (ej: Radeon 780M, Intel Iris Xe, Vega 8...)" onkeyup="filtrarComponentes('card-igpu', this.value)">
                    </div>
                    <div class="hardware-grid" id="grid-igpu"></div>
                </div>
            </div>

            <div class="dropdown-card" id="card-ram">
                <button class="dropdown-trigger" onclick="toggleDropdown(this)">
                    <span>Memoria RAM (DDR5, DDR4, DDR3)</span>
                    <span class="dropdown-icon">▼</span>
                </button>
                <div class="dropdown-content">
                    <div class="inner-search-container">
                        <span>🔍</span>
                        <input type="text" placeholder="Buscar RAM (ej: 16GB DDR4, SO-DIMM laptop, SO-DIMM...)" onkeyup="filtrarComponentes('card-ram', this.value)">
                    </div>
                    <div class="hardware-grid" id="grid-ram"></div>
                </div>
            </div>

            <div class="dropdown-card" id="card-storage">
                <button class="dropdown-trigger" onclick="toggleDropdown(this)">
                    <span>Espacio de Almacenamiento (SSD / HDD)</span>
                    <span class="dropdown-icon">▼</span>
                </button>
                <div class="dropdown-content">
                    <div class="inner-search-container">
                        <span>🔍</span>
                        <input type="text" placeholder="Buscar almacenamiento (ej: NVMe M.2, SATA, HDD...)" onkeyup="filtrarComponentes('card-storage', this.value)">
                    </div>
                    <div class="hardware-grid" id="grid-storage"></div>
                </div>
            </div>

        </div>
    </main>

                "AMD FX & Antiguos": ["AMD FX-9590 / FX-8350 / FX-8320 (Vishera)", "AMD FX-6300 / FX-4300", "AMD Phenom II X6 1090T / X4 965 Black Edition", "AMD Athlon II X4 640"]

                "AMD Ryzen Mobile (Series 7000 a 9000)": ["AMD Ryzen AI 9 HX 370 (Zen 5 Mobile)", "AMD Ryzen 9 7945HX / 7940HS", "AMD Ryzen 7 7840HS / 7735HS / 7730U", "AMD Ryzen 5 7640HS / 7520U"],

                "DDR4 & DDR3": ["32 GB DDR4 Kit (2x16GB) 3600 MHz / 3200 MHz", "16 GB DDR4 Kit (2x8GB) 3600 MHz / 3200 MHz", "8 GB DDR4 3000 MHz / 2666 MHz", "16 GB DDR4 SO-DIMM (Laptop) 3200 MHz / 2666 MHz", "16 GB DDR3 Kit (2x8GB) Escritorio 1600 MHz / 1866 MHz", "8 GB DDR3 SO-DIMM (Laptop) 1600 MHz"]

                "SSDs SATA & HDDs": ["2 TB / 1 TB SSD SATA III 2.5\" (Samsung 870 EVO / Crucial BX500)", "500 GB / 240 GB SSD SATA III 2.5\"", "8 TB / 4 TB HDD Mecánico 3.5\" (Seagate BarraCuda / WD Blue)", "2 TB / 1 TB HDD Mecánico 3.5\" (7200 RPM)", "1 TB / 500 GB HDD Mecánico 2.5\" (Laptops antiguos)"]

        function toggleDropdown(button) {
            const card = button.parentElement;
            card.classList.toggle('active');
        }

        function inicializarListas() {
            renderSeccion('cpu', baseComponentes.cpu);
            renderSeccion('laptop-cpu', baseComponentes.laptopCpu);
            renderSeccion('igpu', baseComponentes.igpu);
            renderSeccion('gpu', baseComponentes.gpu);
            renderSeccion('ram', baseComponentes.ram);
            renderSeccion('storage', baseComponentes.storage);
        }

        function renderSeccion(tipo, datos) {
            const grid = document.getElementById(`grid-${tipo}`);
            grid.innerHTML = '';

            for (const [submarca, items] of Object.entries(datos)) {
                const section = document.createElement('div');
                section.className = 'brand-section';

                const title = document.createElement('div');
                title.className = 'brand-title';
                title.textContent = submarca;
                section.appendChild(title);

                const ul = document.createElement('ul');
                ul.className = 'component-list';

                items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'component-item';
                    li.textContent = item;
                    ul.appendChild(li);
                });

                section.appendChild(ul);
                grid.appendChild(section);
            }
            
            const noRes = document.createElement('div');
            noRes.className = 'no-results';
            noRes.id = `no-results-${tipo}`;
            noRes.textContent = "No se encontraron componentes en esta categoría.";
            grid.appendChild(noRes);
        }

        function filtrarComponentes(cardId, query) {
            const tipo = cardId.replace('card-', '');
            const minQuery = query.toLowerCase().trim();
            const sections = document.querySelectorAll(`#grid-${tipo} .brand-section`);
            let algoVisible = false;

            sections.forEach(section => {
                const items = section.querySelectorAll('.component-item');
                let itemsVisiblesEnSeccion = 0;

                items.forEach(item => {
                    if (item.textContent.toLowerCase().includes(minQuery)) {
                        item.style.display = 'block';
                        itemsVisiblesEnSeccion++;
                        algoVisible = true;
                    } else {
                        item.style.display = 'none';
                    }
                });

                if (itemsVisiblesEnSeccion > 0) {
                    section.style.display = 'block';
                } else {
                    section.style.display = 'none';
                }
            });

            const noResultsAlert = document.getElementById(`no-results-${tipo}`);
            if (algoVisible) {
                noResultsAlert.style.display = 'none';
            } else {
                noResultsAlert.style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', inicializarListas);
    </script>
</body>
